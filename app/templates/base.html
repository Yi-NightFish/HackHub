<!DOCTYPE html>
<html data-theme="bumblebee" class="h-full">

<head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    {% block css %}{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        window.jdenticon_config = { replaceMode: "observe" };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jdenticon@3.3.0/dist/jdenticon.min.js" async
        integrity="sha384-LfouGM03m83ArVtne1JPk926e3SGD0Tz8XHtW2OKGsgeBU/UfR0Fa8eX+UlwSSAZ" crossorigin="anonymous">
    </script>
</head>

<body class="min-h-screen w-full flex flex-col bg-base-200 text-black overflow-x-hidden antialiased">
    
    <header class="sticky top-0 z-50 w-full bg-[#FFFDF6] border-b-2 border-black h-20 grid grid-cols-3 items-center px-4 sm:px-6 select-none">
        
        <!-- Left Side: Logo Area -->
        <div class="flex items-center justify-start">
            <a href='{{ url_for("home") }}' class="flex items-center">
                <img src="{{ url_for('static', filename='/images/logo.png') }}" alt="HackHub Logo" class="h-20 w-auto object-contain mix-blend-multiply" />
            </a>
        </div>

        <!-- Middle: Centered Navigation Links -->
        <nav class="flex items-center justify-center gap-1 sm:gap-2 h-full">
            <a href='{{ url_for("home") }}' class="h-11 px-4 border-2 border-black bg-[#fde047] text-black font-black uppercase tracking-wider shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all inline-flex items-center text-sm">
                Home
            </a>
            <a href='{{ url_for("explore") }}' class="h-11 px-4 border-2 border-transparent hover:border-black hover:bg-black/5 text-black font-extrabold uppercase tracking-wider transition-all inline-flex items-center text-sm">
                Events
            </a>
        </nav>

        <!-- Right Side: Auth / Profile Area -->
        <div class="flex items-center justify-end gap-2 h-full">
            {% if current_user %}
                <a href='{{ url_for("logout") }}' class="h-11 px-4 border-2 border-transparent hover:border-black hover:bg-black/5 text-black font-extrabold uppercase tracking-wider transition-all inline-flex items-center text-sm">
                    Log Out
                </a>

                <!-- Announcements Button with Megaphone -->
                <div class="border-2 border-black p-1 bg-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:scale-105 transition-transform duration-150">
                    <a href="{{ url_for('announcements') }}" class="block w-8 h-8 flex items-center justify-center text-black" aria-label="Announcements">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-megaphone" viewBox="0 0 16 16">
                          <path d="M13 2.5a1.5 1.5 0 0 1 3 0v11a1.5 1.5 0 0 1-3 0v-.214c-2.162-1.241-4.49-1.843-6.912-2.083l.405 2.712A1 1 0 0 1 5.51 15.1h-.548a1 1 0 0 1-.916-.599l-1.85-3.49-.202-.003A2.014 2.014 0 0 1 0 9V7a2.02 2.02 0 0 1 1.992-2.013 75 75 0 0 0 2.483-.075c3.043-.154 6.148-.849 8.525-2.199zm1 0v11a.5.5 0 0 0 1 0v-11a.5.5 0 0 0-1 0m-1 1.35c-2.344 1.205-5.209 1.842-8 2.033v4.233q.27.015.537.036c2.568.189 5.093.744 7.463 1.993zm-9 6.215v-4.13a95 95 0 0 1-1.992.052A1.02 1.02 0 0 0 1 7v2c0 .55.448 1.002 1.006 1.009A61 61 0 0 1 4 10.065m-.657.975 1.609 3.037.01.024h.548l-.002-.014-.443-2.966a68 68 0 0 0-1.722-.082z"/>
                        </svg>
                    </a>
                </div>

                <div class="border-2 border-black p-1 bg-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] hover:scale-105 transition-transform duration-150">
                    <a href='{{ url_for("profile", user_id=current_user.id) }}' class="block w-8 h-8">
                        <svg data-jdenticon-value="{{ current_user.name }}" class="w-full h-full"></svg>
                    </a>
                </div>
            {% else %}
                <a href='{{ url_for("login") }}' class="h-11 px-4 border-2 border-transparent hover:border-black hover:bg-black/5 text-black font-extrabold uppercase tracking-wider transition-all inline-flex items-center text-sm">
                    Login
                </a>
                <a href='{{ url_for("register") }}' class="h-11 px-4 border-2 border-black bg-white text-black font-black uppercase tracking-wider shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all inline-flex items-center text-sm">
                    Sign Up
                </a>
            {% endif %}
        </div>
    </header>

    <main class="w-full flex-1 bg-[#FFFDF6]">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="w-full bg-[#FFFDF6] border-t-2 border-black text-black font-semibold mt-auto">
        <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row items-center justify-between gap-6">
            
            <!-- Footer Logo: Configured identically to the navbar logo alignment style -->
            <div class="flex items-center justify-center">
                <a href='{{ url_for("home") }}' class="block">
                    <img src="{{ url_for('static', filename='/images/logo.png') }}" alt="HackHub Logo" class="h-20 w-auto object-contain mix-blend-multiply" />
                </a>
            </div>
            
            <div class="flex flex-wrap items-center justify-center gap-1 sm:gap-3">
                <a href="{{ url_for('about') }}" class="px-4 py-2 border-2 border-transparent hover:border-black hover:bg-white transition-all duration-75 uppercase tracking-wider font-extrabold text-sm">
                    About
                </a>
                <a href="{{ url_for('faq') }}" class="px-4 py-2 border-2 border-transparent hover:border-black hover:bg-white transition-all duration-75 uppercase tracking-wider font-extrabold text-sm">
                    FAQ
                </a>
                <a href="{{ url_for('feedback') }}" class="px-4 py-2 border-2 border-transparent hover:border-black hover:bg-white transition-all duration-75 uppercase tracking-wider font-extrabold text-sm">
                    Feedback
                </a>
            </div>
            
            <div class="text-xs uppercase font-black tracking-widest text-black/60 text-center md:text-right">
                © 2026 HackHub, Inc. <br class="sm:hidden" />All rights reserved.
            </div>    
        </div>
    </footer>

    {% if current_user %}
    <div hx-get="/active" hx-trigger="every 5s" style="display:none;"></div>
    {% endif %}
</body>

</html>
