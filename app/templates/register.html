{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 bg-[#FFFDF6]">
    
    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 border-2 border-black bg-white shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] rounded-none overflow-hidden">
        
        <div class="p-6 md:p-8 flex flex-col justify-between border-b-4 md:border-b-0 md:border-r-4 border-black min-h-[340px]">
            <div>
                <h2 class="text-2xl font-black uppercase tracking-tight mb-4 text-black">Create an account</h2>
                
                <form method="POST" class="space-y-4">
                    <div class="form-control">
                        <label class="block text-xs font-bold uppercase mb-1 text-black" for="register-email">Email Address</label>
                        <div class="flex items-center gap-3 p-2 bg-white border-3 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                            <svg class="h-4 w-4 text-black shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <input type="email" required placeholder="you@example.com" class="w-full bg-transparent text-sm font-medium text-black border-none focus:outline-none placeholder:text-gray-400" id="register-email" name="email"/>
                        </div>
                    </div>

                    <div class="form-control">
                        <label class="block text-xs font-bold uppercase mb-1 text-black">Password</label>
                        <div class="flex items-center gap-3 p-2 bg-white border-3 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                            <svg class="h-4 w-4 text-black shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            <input type="password" required placeholder="••••••••" class="w-full bg-transparent text-sm font-medium text-black border-none focus:outline-none placeholder:text-gray-400" name="password"/>
                        </div>
                    </div>

                    <div class="flex items-center justify-end pt-1">
                        <button type="submit" class="w-full sm:w-auto px-5 py-2 bg-[#FFAE00] text-sm text-black font-black uppercase tracking-wider border-3 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none cursor-pointer">
                            Register →
                        </button>
                    </div>
                </form>
            </div>

            <div class="mt-4">
                <div class="border-t-2 border-dashed border-black my-4"></div>
                <p class="text-center font-bold text-xs uppercase text-black">
                    Already registered? 
                    <a href="{{ url_for('login') }}" class="underline decoration-2 text-black">Login here</a>
                </p>
            </div>
        </div>

        <div class="hidden md:flex md:flex-col bg-white self-stretch">
            <div class="w-full flex-1 relative min-h-0">
                <img src="{{ url_for('static', filename='/images/sign_up_pic.jpg') }}" alt="Register Visual" class="absolute inset-0 w-full h-full object-cover" />
            </div>
            <div class="px-2 py-0.5 text-left bg-white shrink-0 leading-tight">
                <span class="text-[10px] font-black uppercase tracking-wider text-black/20">Photo by: www.magnific.com</span>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
