{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="card bg-base-200 shadow-lg">
        <div class="card-body">
            <h2 class="card-title">Create an account</h2>

            <form method="POST" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text">Email</span></label>
                    <input type="email" id="email" name="email" required class="input input-bordered w-full" />
                </div>

                <div class="form-control">
                    <label class="label"><span class="label-text">Password</span></label>
                    <input type="password" id="password" name="password" required class="input input-bordered w-full" />
                </div>

                <div class="card-actions justify-end">
                    <button type="submit" class="btn btn-primary">Register</button>
                </div>
            </form>

            <div class="divider">Have an account?</div>
            <p class="text-center"><a href="{{ url_for('login') }}" class="link link-primary">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
