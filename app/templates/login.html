{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="card bg-base-200 shadow-lg">
        <div class="card-body">
            <h2 class="card-title">Log In</h2>

            <form method="POST" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text">Email</span></label>
                    <input type="email" id="email" name="email" required class="input input-bordered w-full" />
                </div>

                <div class="form-control">
                    <label class="label"><span class="label-text">Password</span></label>
                    <input type="password" id="password" name="password" required class="input input-bordered w-full" />
                </div>

                <div class="flex items-center justify-between">
                    <a href="{{ url_for('forget') }}" class="link link-primary">Forgot Password?</a>
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>

            <div class="divider">Or</div>
            <p class="text-center">Don't have an account? <a href="{{ url_for('register') }}" class="link link-primary">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
