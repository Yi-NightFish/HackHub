{% extends "base.html" %}

{% block title %}Chat with {{ other_user.name }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6 max-w-5xl h-[calc(100vh-4rem)] flex flex-col justify-between overflow-hidden">
  
  <div id="chat-box"
       class="flex-1 min-h-0 flex flex-col"
       hx-get="/message?user_id={{ other_user.id }}" 
       hx-trigger="load, every 3s" 
       hx-swap="innerHTML" 
       hx-on::after-request="scrollToBottom()">
       
    {% include "message.html" %}
  </div>

  <form class="card bg-base-200 shadow p-4 grid gap-4 mt-4 shrink-0" 
        hx-post="/send_message" 
        hx-target="#chat-box" 
        hx-swap="innerHTML" 
        hx-on:htmx:after-request="scrollToBottom();clearInput();">
    <div class="form-control">
      <label class="label py-1">
        <span class="label-text font-semibold">Message</span>
      </label>
      <input id="message-box" type="text" name="message" placeholder="Type message" class="input input-bordered w-full" required autocomplete="off">
    </div>
    <input type="hidden" name="user_id" value="{{ other_user.id }}">
    <div class="flex justify-end">
      <button type="submit" class="btn btn-primary btn-sm md:btn-md">Send</button>
    </div>
  </form>
</div>

<script>
  function scrollToBottom() {
    const chatContent = document.getElementById("chat-content");
    if (chatContent) {
      chatContent.scrollTop = chatContent.scrollHeight;
    }
  }

  function clearInput() {
    const messageBox = document.getElementById("message-box");
    if (messageBox) {
      messageBox.value = "";
    }
  }
</script>
{% endblock %}
