{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="card bg-base-200 shadow-lg">
        <div class="card-body">
            <h2 class="card-title">Forgot Password</h2>
            <p class="text-sm text-base-content/70">Enter your account email to receive a verification code.</p>

            <form method="POST" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text">Email</span></label>
                    <input type="email" id="email" name="email" required class="input input-bordered w-full" />
                </div>

                <div class="card-actions justify-end">
                    <button type="submit" class="btn btn-primary">Send OTP</button>
                </div>
            </form>

            <div class="divider"></div>
            <p class="text-center"><a href="{{ url_for('login') }}" class="link link-primary">Back to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
